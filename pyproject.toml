[project]
name = "keysign"
version = "0.1.0"
description = "Sign the keys from a keysigning party and mail the signatures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 79
extend-include = ["keysign"]   # the script has no .py extension
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff specific
]

[tool.mypy]
python_version = "3.11"
files = ["keysign", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

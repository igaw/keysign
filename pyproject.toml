[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keysign"
dynamic = ["version"]
description = "Sign the keys from a keysigning party and mail the signatures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Wagner", email = "wagi@monom.org" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.scripts]
keysign = "keysign.cli:main"

[tool.hatch.version]
path = "src/keysign/__init__.py"

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff specific
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
